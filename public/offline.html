<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174C3C" />
    <title>Offline - KAS INFORMATIKA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #F7F7F4;
        color: #191B19;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        text-align: center;
        max-width: 420px;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background-color: #DDE8DF;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: #174C3C;
      }

      p {
        font-size: 1rem;
        color: #555;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      button {
        background-color: #174C3C;
        color: white;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background-color 150ms ease;
      }

      button:hover {
        background-color: #123D30;
      }

      button:active {
        background-color: #0E2E24;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>Anda Sedang Offline</h1>
      <p>
        Tidak ada koneksi internet. Periksa koneksi Anda dan coba lagi untuk
        mengakses KAS INFORMATIKA.
      </p>
      <button onclick="window.location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
